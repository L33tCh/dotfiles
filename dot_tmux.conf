# Change prefix to Ctrl-a (more comfortable than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Mouse support (scrolling, clicking tabs, resizing)
set -g mouse on

# Faster escape time (crucial for Vim)
set -s escape-time 0

# Start window/pane indexing at 1
set -g base-index 1
setw -g pane-base-index 1

# Professional colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Easier splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Status bar styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-right "%H:%M %d-%b-%y"

# Set Zsh as the default shell for tmux
set-option -g default-shell /usr/bin/zsh
